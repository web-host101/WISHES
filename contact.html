</div>
<div class="collage-overlay"></div>

<div class="content-wrapper">

<nav class="navbar" id="navbar">
  <div class="container">
    <a href="index.html" class="logo">Prachi's<span>Day</span></a>
    <button class="nav-toggle" id="navToggle">
      <span></span><span></span><span></span>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>

    </ul>
    <button class="music-toggle" id="musicToggle" aria-toggle="off">🎵</button>
  </div>
</nav>

<section>
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Get in <span>Touch</span></h2>
      <p class="section-subtitle">Send your birthday wishes for Prachi.</p>
    </div>
    <div class="contact-card" id="contactFormContainer">
      <h2>Send a Message</h2>
      <p>We'd love to hear from you!</p>
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" placeholder="Write a sweet birthday message..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
      </form>
      <div class="success-msg" id="successMsg">
        <div class="check">✓</div>
        <h3>Message Sent!</h3>
        <p>Thank you for your wonderful wishes for Prachi!</p>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="social-links">
      <a href="#" aria-label="Instagram">📸</a>
